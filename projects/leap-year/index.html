<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leap Year</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="project">
      <a class="back" href="../../index.html">← All projects</a>
      <h1>Leap Year</h1>
      <form class="fields">
        <label>Year <input id="year" type="number" value="2024" min="0" step="1" /></label>
      </form>
      <div class="value" id="out" aria-live="polite">—</div>
    </main>
    <script type="module">
      import { isLeapYear } from './logic.js';
      const year = document.getElementById('year');
      const out = document.getElementById('out');
      function render() {
        out.textContent = isLeapYear(Number(year.value)) ? 'Leap year ✅' : 'Not a leap year';
      }
      year.addEventListener('input', render);
      render();
    </script>
  </body>
</html>
